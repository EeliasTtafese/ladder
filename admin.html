<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>የአስተዳዳሪ ገጽ</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2b2b;--line:#ddd;--ac:#ff7a59}
@media (prefers-color-scheme:dark){:root{--bg:#242029;--card:#332e3a;--ink:#f1ece4;--line:#4d4558;--ac:#ff8f70}}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:"Noto Sans Ethiopic",system-ui,sans-serif}
.w{max-width:900px;margin:auto}h1{font-size:1.3rem}
input,button,select{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.c{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.b{padding:2px 8px;border-radius:8px;font-size:.85rem;background:var(--line)}
.k{font-size:1.6rem;letter-spacing:2px;font-weight:bold;text-align:center;padding:10px;border:2px dashed var(--ac);border-radius:10px;user-select:all;margin-top:8px}
small{opacity:.75}#m{min-height:1.4em;color:var(--ac)}
</style></head><body><div class="w">
<h1>🔑 የአስተዳዳሪ ገጽ — እባብና መሰላል</h1><div id="m"></div><div id="v"></div></div>
<script>
var SB="https://nwpllkjuqtpqkyhyenvf.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cGxsa2p1cXRwcWt5aHllbnZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNTYyMTksImV4cCI6MjExMDYzMjIxOX0.UPMbqp-k9Zc1jC5f9xSnmpSnS8fJEm9ZRxbQU3O2O0k",tok=null,KS={};
var $=function(i){return document.getElementById(i)};
function msg(t){$("m").textContent=t||""}
async function api(p,o){o=o||{};o.headers=Object.assign({apikey:KEY,Authorization:"Bearer "+(tok||KEY),"Content-Type":"application/json"},o.headers||{});var r=await fetch(SB+p,o),t=await r.text(),j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw j||{message:r.status};return j}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function login(){$("v").innerHTML='<div class="c"><input id="e" type="email" placeholder="ኢሜል" style="width:100%"><br><br><input id="p" type="password" placeholder="የይለፍ ቃል" style="width:100%"><div class="r"><button class="p" id="go">ግባ</button></div></div>';
$("go").onclick=async function(){if(KEY.indexOf("PASTE")===0){msg("anon key በፋይሉ ውስጥ አልተለጠፈም");return}msg("…");try{var j=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:$("e").value.trim(),password:$("p").value})});tok=j.access_token;msg("");load()}catch(e){msg("መግባት አልተቻለም፦ ኢሜል ወይም የይለፍ ቃል ትክክል አይደለም")}}}
var EM=["መስከረም","ጥቅምት","ኅዳር","ታኅሣሥ","ጥር","የካቲት","መጋቢት","ሚያዝያ","ግንቦት","ሰኔ","ሐምሌ","ነሐሴ","ጳጉሜን"];
function g2j(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function j2e(j){var r=(j-1723856)%1461,n=(r%365)+365*Math.floor(r/1460);return[4*Math.floor((j-1723856)/1461)+Math.floor(r/365)-Math.floor(r/1460),Math.floor(n/30)+1,(n%30)+1]}
function eth(s){var d=new Date(s),e=j2e(g2j(d.getFullYear(),d.getMonth()+1,d.getDate()));return e[2]+" "+EM[e[1]-1]+" "+e[0]}
var PN={day:"ቀን",month:"ወር",year:"ዓመት"};
function left(d){return d.expires_at?new Date(d.expires_at)-Date.now():null}
function state(d){var l=left(d);if(d.status==="revoked")return"🚫 ታግዷል";if(l===null)return"🕓 ፈቃድ የለም";if(l<=0)return"❌ አብቅቷል";return l<=10*864e5?"⚠️ ሊያበቃ ነው":"✅ ንቁ"}
function leftTxt(d){var l=left(d);if(l===null)return"";if(l<=0)return"አብቅቷል";return l<172800000?Math.ceil(l/36e5)+" ሰዓት ቀሪ":Math.ceil(l/864e5)+" ቀን ቀሪ"}
async function load(){try{var d=await api("/rest/v1/devices?select=*&order=registered_at.desc");var k=await api("/rest/v1/license_keys?select=device_id,plan,created_at,used_at&order=created_at.desc");KS={};k.forEach(function(x){(KS[x.device_id]=KS[x.device_id]||[]).push(x)});render(d)}catch(e){tok=null;msg("እንደገና ይግቡ");login()}}
function render(a){var v=$("v");v.innerHTML='<div class="r"><button id="rf">🔄 አድስ</button><input id="sq" placeholder="🔍 ኢሜል፣ ኮድ ወይም ማስታወሻ"><select id="sf"><option value="all">ሁሉም</option><option value="soon">⚠️ በ10 ቀን የሚያበቁ</option><option value="none">🕓 ፈቃድ የሌላቸው</option><option value="exp">❌ ያበቁ</option><option value="act">✅ ንቁ</option></select><small>'+a.length+' መሣሪያዎች</small></div><div id="dp"></div>';
$("rf").onclick=load;
function draw(){var q=$("sq").value.trim().toLowerCase(),f=$("sf").value;$("dp").innerHTML="";
a.filter(function(d){var l=left(d),ok=!q||(d.parent_email+d.device_code+(d.note||"")).toLowerCase().indexOf(q)>=0;
var m=f==="all"||(f==="soon"&&l>0&&l<=10*864e5)||(f==="none"&&l===null&&d.status!=="revoked")||(f==="exp"&&l!==null&&l<=0)||(f==="act"&&l>0&&d.status!=="revoked");return ok&&m}).forEach(function(d){
var c=document.createElement("div");c.className="c";var ks=KS[d.id]||[];
c.innerHTML='<div><b>'+esc(d.parent_email)+'</b></div><div><code>'+esc(d.device_code)+'</code> <span class="b">'+state(d)+'</span></div><small>ተመዝግቧል፦ '+eth(d.registered_at)+(d.expires_at?' · ያበቃል፦ '+eth(d.expires_at)+' ('+leftTxt(d)+')':'')+'</small>'
+(ks.length?'<div><small>🔑 '+ks.slice(0,5).map(function(x){return PN[x.plan]+(x.used_at?" ✔":" (አልተጠቀመም)")}).join(" · ")+'</small></div>':'')
+'<div class="r"><input class="nt" placeholder="📝 ማስታወሻ" style="flex:1;min-width:140px"></div><div class="r"><button class="p" data-p="day">🔑 የቀን</button><button class="p" data-p="month">🔑 የወር</button><button class="p" data-p="year">🔑 የዓመት</button><button data-a="rv">'+(d.status==="revoked"?"♻️ መልስ":"🚫 ከልክል")+'</button></div><div class="kb"></div>';
var nt=c.querySelector(".nt");nt.value=d.note||"";nt.onchange=async function(){try{await api("/rest/v1/devices?id=eq."+d.id,{method:"PATCH",body:JSON.stringify({note:nt.value})});msg("ተቀምጧል ✅")}catch(e){msg("ማስታወሻ አልተቀመጠም")}};
[].forEach.call(c.querySelectorAll("[data-p]"),function(b){b.onclick=async function(){try{var k=await api("/rest/v1/rpc/admin_make_key",{method:"POST",body:JSON.stringify({p_device:d.id,p_plan:b.dataset.p})});c.querySelector(".kb").innerHTML='<div class="k">'+esc(k)+'</div><small>የ'+PN[b.dataset.p]+' ፈቃድ ቁልፍ። አሁን ይቅዱት፤ ከዚህ በኋላ አይታይም። አንድ ጊዜ ብቻ፣ ለዚህ መሣሪያ ብቻ ይሠራል።</small>'}catch(e){msg("ቁልፍ መፍጠር አልተቻለም")}}});
c.querySelector("[data-a=rv]").onclick=async function(){if(d.status!=="revoked"&&!confirm("ይህ መሣሪያ ይከለከል?"))return;try{await api("/rest/v1/devices?id=eq."+d.id,{method:"PATCH",body:JSON.stringify({status:d.status==="revoked"?"registered":"revoked"})});load()}catch(e){msg("አልተሳካም")}};
$("dp").appendChild(c)})}
draw();$("sq").oninput=draw;$("sf").onchange=draw}
login();
</script></body></html>
